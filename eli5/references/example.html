<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is a cache?</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fdf6e3; color: #222; }
  section { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .pic { font-size: clamp(80px, 25vw, 220px); line-height: 1.1; }
  h1 { font-size: clamp(28px, 6vw, 56px); margin: 16px 0 0; }
  p { font-size: clamp(18px, 3.5vw, 32px); margin: 8px 0 0; color: #555; }
  .arrow { font-size: clamp(40px, 8vw, 72px); color: #555; }
</style>
</head>
<body>

<section>
  <div class="pic">🍪</div>
  <h1>You want a cookie.</h1>
  <p class="arrow">↓</p>
  <p>Every time, you drive to the store. 🛒🏢</p>
</section>

<section>
  <div class="pic">🧺🍪</div>
  <h1>Cache = a basket at home.</h1>
  <p>Keep the good stuff close.</p>
</section>

<section>
  <div class="pic">🍪⚡</div>
  <h1>Cookie in the basket?</h1>
  <p>Grab it. Fast. ✅</p>
</section>

<section>
  <div class="pic">🛒 → 🧺</div>
  <h1>Basket empty?</h1>
  <p>Go buy cookies. Refill the basket. 🔄</p>
</section>

<section>
  <div class="pic">🏠🧺 ↔ 🏢</div>
  <h1>That's a cache.</h1>
  <p>Copy nearby is fast. Copy far away is slow.</p>
</section>

</body>
</html>
