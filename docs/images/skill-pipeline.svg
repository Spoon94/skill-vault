<text x="270.0" y="206.0" text-anchor="middle" font-size="12" fill="#5a5a5a">选形式</text>
<line x1="480" y1="215" x2="540" y2="215" stroke="#5a5a5a" stroke-width="2.5" fill="none" marker-end="url(#arw)"/>
<text x="510.0" y="206.0" text-anchor="middle" font-size="12" fill="#5a5a5a">补图</text>
<line x1="720" y1="215" x2="780" y2="215" stroke="#5a5a5a" stroke-width="2.5" fill="none" marker-end="url(#arw)"/>
