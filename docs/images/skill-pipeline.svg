<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1000" height="440" fill="#f8f6f3"/>
<defs>
  <marker id="arw" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 11 4, 0 8" fill="#5a5a5a"/></marker>
</defs>
<text x="500" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">组合技能：四步把「产物」做扎实</text>
<text x="500" y="72" text-anchor="middle" font-size="13" fill="#6a6a6a">编排 → 渲染 → 质量 → 语言</text>
<rect x="60" y="160" width="180" height="110" rx="12" ry="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="150.0" y="213.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">编排</text>
<text x="150.0" y="233.0" text-anchor="middle" font-size="11" fill="#4a4a4a">show-me · eli5<br/>选定讲解形式</text>
<circle cx="60" cy="150" r="15" fill="#4a4a4a"/>
<text x="60" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<rect x="300" y="160" width="180" height="110" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="390.0" y="213.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">渲染</text>
<text x="390.0" y="233.0" text-anchor="middle" font-size="11" fill="#4a4a4a">diagram-*<br/>自带图不够时补图</text>
<circle cx="300" cy="150" r="15" fill="#4a4a4a"/>
<text x="300" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<rect x="540" y="160" width="180" height="110" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="630.0" y="213.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">质量</text>
<text x="630.0" y="233.0" text-anchor="middle" font-size="11" fill="#4a4a4a">falsify<br/>验伪：反例 + 边界</text>
<circle cx="540" cy="150" r="15" fill="#4a4a4a"/>
<text x="540" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<rect x="780" y="160" width="180" height="110" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
