<path d="M 870 270 L 870 330 L 500 330 L 500 360" stroke="#5a5a5a" stroke-width="2.5" fill="none" marker-end="url(#arw)"/>
<path d="M 630 270 L 630 322 L 480 360" stroke="#5a5a5a" stroke-width="2.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arw)"/>
<path d="M 390 270 L 390 322 L 460 360" stroke="#5a5a5a" stroke-width="2.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arw)"/>
<path d="M 150 270 L 150 322 L 440 360" stroke="#5a5a5a" stroke-width="2.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arw)"/>
<rect x="500" y="360" width="0" height="0" rx="12" ry="12" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="2.5"/>
<text x="500.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a"></text>
<rect x="440" y="360" width="120" height="50" rx="12" fill="#1a1a1a"/>
<text x="500" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">交付</text>
<text x="330" y="352" font-size="11" fill="#6a6a6a">任一层产物都可直接交付（虚线）</text>
<text x="60" y="416" font-size="11" fill="#6a6a6a">独立工具技能（gh · tavily · semble · tmux · herdr …）按需穿插任意层</text>
