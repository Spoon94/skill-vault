<text x="870.0" y="233.0" text-anchor="middle" font-size="11" fill="#4a4a4a">clarify · deslop-bi<br/>定风格</text>
<circle cx="780" cy="150" r="15" fill="#4a4a4a"/>
<text x="780" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
