<text x="820.0" y="171.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">falsify</text>
<text x="820.0" y="188.0" text-anchor="middle" font-size="10" fill="#4a4a4a">验伪：反例+失效机制+边界</text>
