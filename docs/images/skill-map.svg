<text x="500" y="530" text-anchor="middle" font-size="11" fill="#4a4a4a">渲染层：自带图不够时按格式取</text>
<rect x="680" y="100" width="280" height="420" rx="12" fill="#d4f0e8"/>
<text x="820.0" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">打磨交付 · 做扎实</text>
