<text x="820.0" y="348.0" text-anchor="middle" font-size="10" fill="#4a4a4a">要自然 · 去 AI 味</text>
<text x="820" y="400" text-anchor="middle" font-size="11" fill="#4a4a4a">质量 + 语言：验伪 → 定风格</text>
