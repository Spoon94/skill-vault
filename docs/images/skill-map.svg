<text x="180.0" y="251.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">show-me</text>
<text x="180.0" y="268.0" text-anchor="middle" font-size="10" fill="#4a4a4a">技术向图文编排<br/>选最小视图讲清</text>
